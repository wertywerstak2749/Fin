<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для тебя 💗</title>
<style>
:root{--bg1:#fff1f4;--bg2:#ffc9d8;--ink:#4a1b2e;--soft:#8a4a62;--accent:#e63e6d;--card:rgba(255,255,255,.65);--line:rgba(230,62,109,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a0a12;--bg2:#3d1328;--ink:#ffe8ef;--soft:#e3a9bf;--accent:#ff5c8a;--card:rgba(255,255,255,.07);--line:rgba(255,92,138,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1a0a12;--bg2:#3d1328;--ink:#ffe8ef;--soft:#e3a9bf;--accent:#ff5c8a;--card:rgba(255,255,255,.07);--line:rgba(255,92,138,.3);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;display:grid;place-items:center;padding:20px;overflow:hidden;color:var(--ink);background:radial-gradient(circle at 30% 20%,var(--bg2),var(--bg1) 70%);font-family:Georgia,"Times New Roman",serif}
.card{position:relative;z-index:2;width:100%;max-width:440px;padding:40px 28px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(230,62,109,.18)}
.heart{font-size:96px;line-height:1;display:inline-block;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
p{margin:0 0 14px;font-size:19px;line-height:1.55;color:var(--soft);opacity:0;transform:translateY(10px);animation:in .9s ease forwards}
p.big{font-size:27px;font-weight:700;color:var(--ink);margin:22px 0 26px;line-height:1.25}
@keyframes in{to{opacity:1;transform:none}}
.btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;min-height:52px;opacity:0;animation:in .9s ease forwards;animation-delay:6.2s}
button{font:inherit;font-size:18px;border:0;cursor:pointer;border-radius:999px;padding:14px 30px;transition:transform .2s,box-shadow .2s}
#yes{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 8px 24px rgba(230,62,109,.4)}
#yes:hover{transform:scale(1.07)}
#no{background:transparent;color:var(--soft);border:1px solid var(--line)}
#no.run{position:fixed;z-index:5}
.fl{position:fixed;bottom:-40px;z-index:1;pointer-events:none;animation:up linear forwards;opacity:.5}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
#done{display:none}
#done h1{font-size:30px;margin:14px 0 10px}
</style>
</head>
<body>
<main class="card">
  <div id="ask">
    <div class="heart">💗</div>
    <p style="animation-delay:.6s;margin-top:12px">Прости меня, я тебя очень сильно люблю.</p>
    <p style="animation-delay:2.2s">Я понял, что очень сильно накосячил. Я виноват.</p>
    <p style="animation-delay:3.8s">Мне правда жаль за всё, что я сделал. Я люблю тебя и хочу всё исправить.</p>
    <p class="big" style="animation-delay:5.2s">Дашь нам ещё один шанс?</p>
    <div class="btns">
      <button id="yes">Да, давай 💖</button>
      <button id="no">Мне нужно время</button>
    </div>
  </div>
  <div id="done">
    <div class="heart">💞</div>
    <h1>Спасибо, что даёшь нам шанс</h1>
    <p style="opacity:1;transform:none">Обещаю беречь это и стараться каждый день. Люблю тебя.</p>
  </div>
</main>
<script>
var H=["💗","💖","💕","❤️","💘"];
function fly(n,fast){for(var i=0;i<n;i++){var s=document.createElement("span");s.className="fl";s.textContent=H[Math.floor(Math.random()*H.length)];s.style.left=Math.random()*100+"vw";s.style.fontSize=(14+Math.random()*26)+"px";var d=(fast?3:7)+Math.random()*5;s.style.animationDuration=d+"s";document.body.appendChild(s);setTimeout(function(x){x.remove()},d*1000+100,s)}}
fly(6);setInterval(function(){fly(1)},900);
document.getElementById("no").addEventListener("click",function(){document.getElementById("ask").style.display="none";var d=document.getElementById("done");d.querySelector(".heart").textContent="🤍";d.querySelector("h1").textContent="Я понимаю";d.querySelector("p").textContent="Возьми столько времени, сколько нужно. Спасибо, что прочитала.";d.style.display="block"});
document.getElementById("yes").addEventListener("click",function(){
document.getElementById("ask").style.display="none";
document.getElementById("done").style.display="block";
fly(60,true)});
</script>
</body>
</html>
