<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Куда сходить вдвоём в Архангельске ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
            backdrop-filter: blur(10px);
        }

        .filter-btn:hover, .filter-btn.active {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .card-icon {
            font-size: 2em;
        }

        .card-title {
            font-size: 1.3em;
            color: #333;
            font-weight: 600;
        }

        .card-price {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }

        .card-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .card-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            color: #666;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .filters {
                gap: 8px;
            }
            
            .filter-btn {
                padding: 10px 16px;
                font-size: 0.9em;
            }
            
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Куда сходить вдвоём в Архангельске ❤️</h1>
            <p class="subtitle">Идеи для парня и девушки · 19 лет · цены ориентировочно на двоих</p>
        </header>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">🔥 Активно</button>
            <button class="filter-btn" data-filter="romantic">❤️ Романтика</button>
            <button class="filter-btn" data-filter="unusual">🥽 Необычно</button>
            <button class="filter-btn" data-filter="cheap">💸 Дёшево</button>
            <button class="filter-btn" data-filter="best">🔥 Мой лучший вариант</button>
        </div>

        <div class="cards-grid">
            <!-- Карточки будут добавлены через JavaScript -->
        </div>
    </div>

    <script>
        const activities = [
            {
                title: "Квест-рум",
                icon: "🧩",
                price: "1500–2000 ₽",
                description: "Пройти вместе квест — отличное приключение для двоих. Выбирайте тематику по интересам.",
                tags: ["active", "unusual"],
                category: "active"
            },
            {
                title: "Романтический ужин",
                icon: "🍽️",
                price: "2500–4000 ₽",
                description: "Уютный ресторан с живой музыкой или панорамным видом. Идеально для спокойного разговора.",
                tags: ["romantic"],
                category: "romantic"
            },
            {
                title: "Прогулка по набережной",
                icon: "🌃",
                price: "0–500 ₽",
                description: "Вечерняя прогулка по центру города или набережной. Можно взять кофе с собой.",
                tags: ["romantic", "cheap"],
                category: "romantic"
            },
            {
                title: "Боулинг",
                icon: "🎳",
                price: "800–1500 ₽",
                description: "Активный отдых с элементами соревнования. Можно совместить с лёгким ужином.",
                tags: ["active", "unusual"],
                category: "active"
            },
            {
                title: "Кинотеатр",
                icon: "🎬",
                price: "600–1000 ₽",
                description: "Новинки кино или классика в уютном зале. Попкорн и напитки создадут атмосферу.",
                tags: ["romantic", "cheap"],
                category: "romantic"
            },
            {
                title: "Мастер-класс",
                icon: "🎨",
                price: "1500–2500 ₽",
                description: "Совместное творчество: рисование, кулинария, танцы. Памятный опыт и результат.",
                tags: ["unusual", "romantic"],
                category: "unusual"
            },
            {
                title: "Парк аттракционов",
                icon: "🎡",
                price: "1000–2000 ₽",
                description: "Эмоции и адреналин на свежем воздухе. Отлично для активного свидания.",
                tags: ["active", "unusual"],
                category: "active"
            },
            {
                title: "Кофейня",
                icon: "☕",
                price: "400–800 ₽",
                description: "Уютное место для долгих разговоров. Можно играть в настолки или просто болтать.",
                tags: ["cheap", "romantic"],
                category: "cheap"
            },
            {
                title: "Выставка или музей",
                icon: "🖼️",
                price: "400–1000 ₽",
                description: "Культурная программа для любознательных пар. Обсуждение экспонатов сближает.",
                tags: ["unusual", "cheap"],
                category: "unusual"
            },
            {
                title: "Лучший вариант: Квест + Ужин + Прогулка",
                icon: "⭐",
                price: "4000–5500 ₽",
                description: "Чтобы свидание не превратилось просто в «посидели в кафе». Квест → пройти вместе, Ужин → спокойно поговорить, Прогулка → центр / набережная.",
                tags: ["best"],
                category: "best"
            }
        ];

        const cardsGrid = document.querySelector('.cards-grid');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function renderCards(filter = 'all') {
            cardsGrid.innerHTML = '';
            
            activities.forEach(activity => {
                if (filter === 'all' || activity.category === filter) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="card-icon">${activity.icon}</span>
                            <h3 class="card-title">${activity.title}</h3>
                        </div>
                        <div class="card-price">${activity.price}</div>
                        <p class="card-description">${activity.description}</p>
                        <div class="card-tags">
                            ${activity.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                        </div>
                    `;
                    cardsGrid.appendChild(card);
                }
            });
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderCards(btn.dataset.filter);
            });
        });

        renderCards();
    </script>
</body>
</html>
